name: online-shop-e2e
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: online_shop_e2e
      POSTGRES_USER: online_shop_e2e
      POSTGRES_PASSWORD: e2e_local_only
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - e2e_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U online_shop_e2e -d online_shop_e2e"]
      interval: 3s
      timeout: 3s
      retries: 20
  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "127.0.0.1:1026:1025"
      - "127.0.0.1:8026:8025"
volumes:
  e2e_postgres_data:
