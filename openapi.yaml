  /order-items/{id}/review:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer, format: int64 } }
    get:
      summary: The Customer's own review of one of their order items
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      responses:
        '200':
          description: Own review (any status)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MyReview' }
        '404': { description: ORDER_ITEM_NOT_FOUND (not the caller's item) or REVIEW_NOT_FOUND }
    post:
      summary: Review an item of an own DELIVERED order (one review per item)
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReviewRequest' }
      responses:
        '201':
          description: Review published (VISIBLE)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MyReview' }
        '400': { description: INVALID_REQUEST (rating not 1-5, comment over 2000 characters) }
        '404': { description: ORDER_ITEM_NOT_FOUND }
        '409': { description: REVIEW_ALREADY_EXISTS (use PATCH to edit) }
        '422': { description: REVIEW_NOT_ALLOWED (order not DELIVERED) }
    patch:
      summary: Edit the own review. A hidden review stays hidden.
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReviewRequest' }
      responses:
        '200':
          description: Updated review
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MyReview' }
        '400': { description: INVALID_REQUEST }
        '404': { description: ORDER_ITEM_NOT_FOUND or REVIEW_NOT_FOUND }
  /manager/reviews:
    get:
      summary: All reviews for moderation, newest first (requires MANAGER_REVIEW_MODERATE)
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      parameters:
        - { in: query, name: status, schema: { type: string, enum: [VISIBLE, HIDDEN] } }
        - { in: query, name: rating, schema: { type: integer, minimum: 1, maximum: 5 } }
        - { in: query, name: q, description: Product name/SKU, order code, customer name/email or comment, schema: { type: string, maxLength: 100 } }
        - { in: query, name: page, schema: { type: integer, minimum: 0, default: 0 } }
        - { in: query, name: size, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: Review page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ManagerReviewPage' }
  /manager/reviews/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer, format: int64 } }
    patch:
      summary: Hide, restore and/or publicly reply to a review (requires MANAGER_REVIEW_MODERATE)
      description: Send status, reply or both. A blank reply removes the reply. Every change is audited (REVIEW_HIDDEN, REVIEW_RESTORED, REVIEW_REPLIED, REVIEW_REPLY_REMOVED).
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ModerateReviewRequest' }
      responses:
        '200':
          description: Moderated review
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ManagerReview' }
        '400': { description: INVALID_REQUEST (nothing to change, unknown status, reply over 1000 characters) }
        '404': { description: REVIEW_NOT_FOUND }
  /orders/returns:
    get:
      summary: The customer's own return/refund requests, newest first (UC-CUS-014, UC-MNG-004)
      description: Each request carries its status and the Manager's decision note, so the customer sees approval (MSG-032) or the rejection reason (MSG-033).
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      responses:
        '200':
          description: Own requests
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/ReturnRequestView' } }
        '403': { description: 'Not a customer' }
  /orders/{orderId}/returns:
    parameters:
      - { in: path, name: orderId, required: true, schema: { type: integer, format: int64 } }
    post:
      summary: Request Refund Only or Return and Refund for items of an own Delivered order (UC-CUS-014)
      description: The order must be DELIVERED and inside system_settings.return_window_days (default 7) counted from delivery. Refund per item = line total minus its share of the order discount; shipping is not refunded. Audited as RETURN_REQUEST_CREATED.
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateReturnRequest' }
      responses:
        '201':
          description: Request created with status REQUESTED (MSG-051)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReturnRequestView' }
        '400': { description: 'INVALID_RETURN_TYPE, INVALID_ORDER_ITEM, DUPLICATE_RETURN_ITEM or validation failure' }
        '404': { description: 'NOT_FOUND (order missing or owned by another customer)' }
        '409': { description: 'RETURN_ORDER_NOT_DELIVERED or RETURN_WINDOW_EXPIRED (MSG-030); RETURN_QUANTITY_EXCEEDED (MSG-048)' }
  /manager/returns:
    get:
      summary: Return/refund requests for decision, newest first (requires MANAGER_RETURN_DECIDE)
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      parameters:
        - { in: query, name: status, schema: { $ref: '#/components/schemas/ReturnStatus' } }
        - { in: query, name: page, schema: { type: integer, minimum: 0, default: 0 } }
        - { in: query, name: size, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: Request page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReturnRequestPage' }
  /manager/returns/{id}/decision:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer, format: int64 } }
    post:
      summary: Approve or reject a request (requires MANAGER_RETURN_DECIDE, UC-MNG-004)
      description: >-
        REQUESTED Refund Only → approve creates a PENDING refund (status REFUND_PENDING).
        REQUESTED Return and Refund → approve authorizes the return (RETURN_AUTHORIZED).
        INSPECTED → approve creates a PENDING refund for the received ELIGIBLE quantity.
        Reject needs a note (MSG-050) and sets REJECTED. Decisions are audited.
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReturnDecisionRequest' }
      responses:
        '200':
          description: Decided request
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReturnRequestView' }
        '400': { description: 'REJECT_NOTE_REQUIRED' }
        '404': { description: 'NOT_FOUND' }
        '409': { description: 'RETURN_ALREADY_DECIDED, NO_REFUNDABLE_ITEMS or ORDER_NOT_PAID' }
  /warehouse/returns:
    get:
      summary: RETURN_AUTHORIZED requests waiting for inspection (requires WAREHOUSE_RETURN_INSPECT, UC-WH-002)
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      parameters:
        - { in: query, name: page, schema: { type: integer, minimum: 0, default: 0 } }
        - { in: query, name: size, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: Inspection queue
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReturnRequestPage' }
  /warehouse/returns/{id}/inspection:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer, format: int64 } }
    post:
      summary: Record the inspection of every item of a request (requires WAREHOUSE_RETURN_INSPECT)
      description: Restock ≤ received ≤ requested and a condition note are required (MSG-050). An item is ELIGIBLE when received > 0. Restocked units return to stock with a RETURN_RESTOCK inventory movement; the request becomes INSPECTED.
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InspectionRequest' }
      responses:
        '200':
          description: Inspected request
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReturnRequestView' }
        '400': { description: 'INSPECTION_ITEMS_MISMATCH, INVALID_INSPECTION_ITEM or INVALID_INSPECTION_QUANTITY' }
        '404': { description: 'NOT_FOUND' }
        '409': { description: 'RETURN_NOT_AUTHORIZED' }
  /manager/refunds:
    get:
      summary: Refunds, by default PENDING ones to complete (requires MANAGER_REFUND_COMPLETE)
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      parameters:
        - { in: query, name: status, schema: { type: string, enum: [PENDING, PROCESSING, COMPLETED, FAILED] } }
        - { in: query, name: page, schema: { type: integer, minimum: 0, default: 0 } }
        - { in: query, name: size, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: Refund page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RefundPage' }
  /manager/refunds/{id}/complete:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer, format: int64 } }
    post:
      summary: Record that a PENDING refund was paid out (requires MANAGER_REFUND_COMPLETE)
      description: Simulated; no payment gateway is called and no real money moves. Sets the refund COMPLETED and a linked request REFUNDED; audited as REFUND_COMPLETED.
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      responses:
        '200':
          description: Completed refund
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RefundView' }
        '404': { description: 'NOT_FOUND' }
        '409': { description: 'REFUND_NOT_PENDING' }
  /after-sales/failed-deliveries:
    get:
      summary: Paid QR orders Returned to Warehouse that have no refund yet (requires MANAGER_REFUND_COMPLETE)
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      responses:
        '200':
          description: Refund candidates
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/FailedDeliveryOrder' } }
  /after-sales/failed-deliveries/{orderId}/refund:
    parameters:
      - { in: path, name: orderId, required: true, schema: { type: integer, format: int64 } }
    post:
      summary: Create a PENDING refund (FAILED_PREPAID_DELIVERY) for a paid QR order returned after failed delivery (requires MANAGER_REFUND_COMPLETE)
      description: COD orders never get a refund because no money was collected. One refund per order (idempotency key FAILED-DELIVERY-orderId).
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      responses:
        '200':
          description: Pending refund
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RefundView' }
        '404': { description: 'NOT_FOUND' }
        '409': { description: 'ORDER_NOT_RETURNED, ORDER_NOT_PREPAID, ORDER_NOT_PAID or REFUND_ALREADY_EXISTS' }
  /support/tickets:
    get:
      summary: The customer's own tickets with their messages (UC-CUS-019)
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      responses:
        '200':
          description: Own tickets
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/SupportTicket' } }
    post:
      summary: Create a ticket with a first message, optionally about an own order (UC-CUS-019)
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTicketRequest' }
      responses:
        '201':
          description: Ticket created with status OPEN
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupportTicket' }
        '400': { description: 'Subject or message empty, or too long' }
        '404': { description: 'NOT_FOUND (order owned by another customer)' }
  /support/tickets/queue:
    get:
      summary: Support queue, filtered by status (requires SUPPORT_TICKET_VIEW, UC-SUP-002)
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      parameters:
        - { in: query, name: status, schema: { type: string, enum: [OPEN, IN_PROGRESS, RESOLVED, CLOSED] } }
        - { in: query, name: page, schema: { type: integer, minimum: 0, default: 0 } }
        - { in: query, name: size, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: Ticket page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupportTicketPage' }
  /support/tickets/{id}/messages:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer, format: int64 } }
    post:
      summary: Add a message — the owning customer, or Support (requires SUPPORT_TICKET_REPLY)
      description: The first staff reply on an OPEN ticket assigns it to that staff member and sets IN_PROGRESS.
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TicketMessageRequest' }
      responses:
        '200':
          description: Ticket with the new message
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupportTicket' }
        '403': { description: 'Not the owner and not Support' }
        '404': { description: 'NOT_FOUND' }
        '409': { description: 'TICKET_CLOSED' }
  /support/tickets/{id}/status:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer, format: int64 } }
    patch:
      summary: Set IN_PROGRESS, RESOLVED or CLOSED (requires SUPPORT_TICKET_REPLY); audited
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TicketStatusRequest' }
      responses:
        '200':
          description: Updated ticket
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupportTicket' }
        '404': { description: 'NOT_FOUND' }
        '409': { description: 'TICKET_CLOSED' }
  /manager/reports/dashboard:
    get:
      summary: Manager dashboard (UC-MNG-006); default range is the last 30 days
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      parameters:
        - { in: query, name: from, schema: { type: string, format: date } }
        - { in: query, name: to, schema: { type: string, format: date } }
      responses:
        '200':
          description: Tiles, daily series, top products, low stock and pending actions
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DashboardView' }
        '400': { description: 'INVALID_REPORT_RANGE (more than 366 days, reversed or in the future)' }
  /manager/reports/summary:
    get:
      summary: Transaction report rows and totals (UC-MNG-010), Asia/Ho_Chi_Minh
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      parameters:
        - { in: query, name: from, required: true, schema: { type: string, format: date } }
        - { in: query, name: to, required: true, schema: { type: string, format: date } }
      responses:
        '200':
          description: Report summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportSummary' }
        '400': { description: 'INVALID_REPORT_RANGE' }
  /manager/reports/export.csv:
    get:
      summary: CSV export of the transaction report, one row per day and a total row (UC-MNG-010)
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      parameters:
        - { in: query, name: from, required: true, schema: { type: string, format: date } }
        - { in: query, name: to, required: true, schema: { type: string, format: date } }
      responses:
        '200':
          description: CSV file (date, order count, paid order count, collected revenue, refunded amount, refund count)
          content:
            text/csv:
              schema: { type: string }
        '400': { description: 'INVALID_REPORT_RANGE' }
  /manager/reports/daily-reports:
    get:
      summary: Warehouse and Delivery daily reports for a date, read-only (UC-MNG-007); default today
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      parameters:
        - { in: query, name: date, schema: { type: string, format: date } }
      responses:
        '200':
          description: Reports of the day (empty list = MSG-036 on screen)
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/StaffReportRow' } }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Opaque token issued by /auth/login; expires after 24 hours total or 30 idle minutes
    sessionCookie:
      type: apiKey
      in: cookie
      name: FORME_SESSION
      description: Expires after 24 hours total or 30 idle minutes; browser writes also require X-XSRF-TOKEN from /auth/csrf
  schemas:
    TokenRequest:
      type: object
      required: [token]
      properties:
        token: { type: string }
    MfaVerifyRequest:
      type: object
      required: [challengeToken, code]
      properties:
        challengeToken: { type: string }
        code: { type: string, description: Six-digit email or TOTP code, or a single-use MFA recovery code at login }
    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword, confirmPassword]
      properties:
        currentPassword: { type: string, format: password }
        newPassword: { type: string, format: password, minLength: 8, maxLength: 72 }
        confirmPassword: { type: string, format: password }
    CurrentPasswordRequest:
      type: object
      required: [password]
      properties:
        password: { type: string, format: password }
    MfaSensitiveRequest:
      type: object
      required: [password, challengeToken, code]
      properties:
        password: { type: string, format: password }
        challengeToken: { type: string }
        code: { type: string, description: Current email/TOTP code or an unused recovery code }
    TotpConfirmRequest:
      type: object
      required: [code]
      properties:
        code: { type: string, pattern: '^[0-9]{6}$' }
    EmailChangeRequest:
      type: object
      required: [newEmail, currentPassword]
      properties:
        newEmail: { type: string, format: email }
        currentPassword: { type: string, format: password }
    StaffInvitationRequest:
      type: object
      required: [email, fullName, role]
      properties:
        email: { type: string, format: email }
        fullName: { type: string, maxLength: 150 }
        phone: { type: string, maxLength: 30 }
        role: { type: string, enum: [ADMIN, MANAGER, SUPPORT, WAREHOUSE, DELIVERY] }
    AcceptInvitationRequest:
      type: object
      required: [token, password, confirmPassword]
      properties:
        token: { type: string }
        password: { type: string, format: password, minLength: 8, maxLength: 72 }
        confirmPassword: { type: string, format: password }
    RegisterRequest:
      type: object
      required: [fullName, email, password, confirmPassword]
      properties:
        fullName: { type: string, maxLength: 150 }
        email: { type: string, format: email, maxLength: 255 }
        password: { type: string, format: password, minLength: 8, maxLength: 72 }
        confirmPassword: { type: string, format: password, minLength: 8, maxLength: 72 }
        phone: { type: string, maxLength: 30 }
    RegisterResponse:
      type: object
      required: [userId, verificationRequired, emailSent]
      properties:
        userId: { type: integer, format: int64 }
        verificationRequired: { type: boolean }
        emailSent: { type: boolean }
    VerifyRequest:
      type: object
      required: [token]
      properties:
        token: { type: string }
    VerifyResponse:
      type: object
      required: [verified]
      properties:
        verified: { type: boolean }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }
    PasswordResetRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }
    PasswordResetConfirmRequest:
      type: object
      required: [token, newPassword, confirmPassword]
      properties:
        token: { type: string }
        newPassword: { type: string, format: password, minLength: 8, maxLength: 72 }
        confirmPassword: { type: string, format: password, minLength: 8, maxLength: 72 }
    PasswordResetConfirmResponse:
      type: object
      required: [reset]
      properties:
        reset: { type: boolean }
    AuthUser:
      type: object
      required: [id, email, fullName, role]
      properties:
        id: { type: integer, format: int64 }
        email: { type: string, format: email }
        fullName: { type: string }
        role: { type: string, enum: [CUSTOMER, ADMIN, MANAGER, SUPPORT, WAREHOUSE, DELIVERY] }
    Profile:
      type: object
      required: [id, email, fullName, role]
      properties:
        id: { type: integer, format: int64 }
        email: { type: string, format: email }
        fullName: { type: string }
        phone: { type: string, nullable: true }
        role: { type: string, enum: [CUSTOMER, ADMIN, MANAGER, SUPPORT, WAREHOUSE, DELIVERY] }
    ProfileUpdateRequest:
      type: object
      required: [fullName]
      properties:
        fullName: { type: string, minLength: 1, maxLength: 150 }
        phone: { type: string, nullable: true, maxLength: 30 }
    AddressRequest:
      type: object
      required: [recipientName, phone, addressLine, province]
      properties:
        recipientName: { type: string, minLength: 1, maxLength: 150 }
        phone: { type: string, minLength: 1, maxLength: 30 }
        addressLine: { type: string, minLength: 1, maxLength: 300 }
        ward: { type: string, nullable: true, maxLength: 120 }
        district: { type: string, nullable: true, maxLength: 120 }
        province: { type: string, minLength: 1, maxLength: 120 }
        isDefault: { type: boolean, default: false }
    Address:
      allOf:
        - { $ref: '#/components/schemas/AddressRequest' }
        - type: object
          required: [id, isDefault]
          properties:
            id: { type: integer, format: int64 }
    LoginResponse:
      type: object
      required: [accessToken, expiresAt, user]
      properties:
        accessToken: { type: string, description: Returned only at login; store securely on the client }
        expiresAt: { type: string, format: date-time }
        user: { $ref: '#/components/schemas/AuthUser' }
    Product:
      type: object
      required: [id, sku, name, price, categoryName, availableQuantity]
      properties:
        id: { type: integer, format: int64 }
        sku: { type: string }
        name: { type: string }
        description: { type: string, nullable: true }
        imageUrl: { type: string, nullable: true }
        price: { type: number, description: VND amount }
        categoryName: { type: string }
        availableQuantity: { type: integer, minimum: 0 }
    ProductPage:
      type: object
      required: [items, page, size, totalItems, totalPages]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Product' }
        page: { type: integer }
        size: { type: integer }
        totalItems: { type: integer, format: int64 }
        totalPages: { type: integer, format: int64 }
    ProductDetail:
      allOf:
        - { $ref: '#/components/schemas/Product' }
        - type: object
          required: [categoryId, reviewCount]
          properties:
            categoryId: { type: integer, format: int64 }
            avgRating: { type: number, nullable: true, description: Average of VISIBLE reviews, one decimal }
            reviewCount: { type: integer, format: int64, minimum: 0 }
    Category:
      type: object
      required: [id, name]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        description: { type: string, nullable: true }
    CartLine:
      type: object
      required: [id, productId, sku, name, unitPrice, quantity, availableQuantity, lineTotal]
      properties:
        id: { type: integer, format: int64 }
        productId: { type: integer, format: int64 }
        sku: { type: string }
        name: { type: string }
        imageUrl: { type: string, nullable: true }
        unitPrice: { type: number, description: Current price; checkout revalidates }
        quantity: { type: integer, minimum: 1, maximum: 99 }
        availableQuantity: { type: integer, minimum: 0 }
        lineTotal: { type: number }
        warning: { type: string, nullable: true, enum: [PRODUCT_UNAVAILABLE, INSUFFICIENT_STOCK] }
    Cart:
      type: object
      required: [items, itemCount, subtotal]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/CartLine' }
        itemCount: { type: integer, description: Sum of quantities, for the header badge }
        subtotal: { type: number, description: Lines with a warning are excluded }
    ManagerProductRequest:
      type: object
      required: [sku, name, price, categoryId]
      properties:
        sku: { type: string, maxLength: 80, pattern: '^[A-Za-z0-9][A-Za-z0-9_-]*$', description: 'Stored upper-case; unique ignoring case' }
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, nullable: true, maxLength: 5000, description: Blank means none }
        imageUrl: { type: string, nullable: true, maxLength: 500, description: 'http(s) URL or a path starting with /; blank means none' }
        price: { type: number, minimum: 0, exclusiveMinimum: true, description: VND }
        categoryId: { type: integer, format: int64, description: Must exist and not be ARCHIVED }
    ManagerProduct:
      type: object
      required: [id, sku, name, price, categoryId, categoryName, categoryStatus, status, stockOnHand, stockReserved, availableQuantity, createdAt, updatedAt]
      properties:
        id: { type: integer, format: int64 }
        sku: { type: string }
        name: { type: string }
        description: { type: string, nullable: true }
        imageUrl: { type: string, nullable: true }
        price: { type: number }
        categoryId: { type: integer, format: int64 }
        categoryName: { type: string }
        categoryStatus: { type: string, enum: [ACTIVE, INACTIVE, ARCHIVED] }
        status: { type: string, enum: [DRAFT, ACTIVE, INACTIVE, ARCHIVED] }
        stockOnHand: { type: integer, description: 'Read-only here; changed by Warehouse' }
        stockReserved: { type: integer, description: 'Read-only; reserved by unpaid or unpacked orders' }
        availableQuantity: { type: integer, description: stockOnHand minus stockReserved }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ManagerProductPage:
      type: object
      required: [items, page, size, totalItems, totalPages]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ManagerProduct' }
        page: { type: integer }
        size: { type: integer }
        totalItems: { type: integer, format: int64 }
        totalPages: { type: integer, format: int64 }
    ProductStatusRequest:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [DRAFT, ACTIVE, INACTIVE, ARCHIVED] }
    CategoryOption:
      type: object
      required: [id, name, status]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        status: { type: string, enum: [ACTIVE, INACTIVE] }
    CategoryRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 150 }
        description: { type: string, nullable: true, maxLength: 2000 }
    CategoryStatusRequest:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ACTIVE, INACTIVE, ARCHIVED] }
    ManagerCategory:
      type: object
      required: [id, name, status, productCount, activeProductCount, createdAt, updatedAt]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        description: { type: string, nullable: true }
        status: { type: string, enum: [ACTIVE, INACTIVE, ARCHIVED] }
        productCount: { type: integer, format: int64, description: Products in any status }
        activeProductCount: { type: integer, format: int64 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ReviewRequest:
      type: object
      required: [rating]
      properties:
        rating: { type: integer, minimum: 1, maximum: 5 }
        comment: { type: string, nullable: true, maxLength: 2000 }
    MyReview:
      type: object
      required: [id, orderItemId, productId, rating, status, createdAt, updatedAt]
      properties:
        id: { type: integer, format: int64 }
        orderItemId: { type: integer, format: int64 }
        productId: { type: integer, format: int64 }
        rating: { type: integer, minimum: 1, maximum: 5 }
        comment: { type: string, nullable: true }
        status: { type: string, enum: [VISIBLE, HIDDEN] }
        managerReply: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    PublicReview:
      type: object
      required: [id, authorName, rating, createdAt, edited]
      properties:
        id: { type: integer, format: int64 }
        authorName: { type: string, description: First word and last initial of the full name }
        rating: { type: integer, minimum: 1, maximum: 5 }
        comment: { type: string, nullable: true }
        managerReply: { type: string, nullable: true }
        repliedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        edited: { type: boolean, description: The customer changed the review after posting it }
    PublicReviewPage:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/PublicReview' } }
        page: { type: integer }
        size: { type: integer }
        totalItems: { type: integer, format: int64 }
        totalPages: { type: integer, format: int64 }
    ModerateReviewRequest:
      type: object
      properties:
        status: { type: string, enum: [VISIBLE, HIDDEN] }
        reply: { type: string, nullable: true, maxLength: 1000, description: Blank removes the reply }
    ManagerReview:
      type: object
      required: [id, productId, productName, sku, orderId, orderCode, customerName, customerEmail, rating, status, createdAt, updatedAt]
      properties:
        id: { type: integer, format: int64 }
        productId: { type: integer, format: int64 }
        productName: { type: string }
        sku: { type: string }
        orderId: { type: integer, format: int64 }
        orderCode: { type: string }
        customerName: { type: string }
        customerEmail: { type: string }
        rating: { type: integer, minimum: 1, maximum: 5 }
        comment: { type: string, nullable: true }
        status: { type: string, enum: [VISIBLE, HIDDEN] }
        managerReply: { type: string, nullable: true }
        repliedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ManagerReviewPage:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ManagerReview' } }
        page: { type: integer }
        size: { type: integer }
        totalItems: { type: integer, format: int64 }
        totalPages: { type: integer, format: int64 }
    Problem:
      type: object
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code: { type: string }
    PlaceOrderRequest:
      type: object
      required: [addressId, paymentMethod]
      properties:
        addressId: { type: integer, format: int64, description: One of the current Customer's saved addresses }
        paymentMethod: { type: string, enum: [SIMULATED_QR, COD] }
        voucherCode: { type: string, maxLength: 60, nullable: true, description: Case-insensitive }
    OrderStatus:
      type: string
      enum: [AWAITING_PAYMENT, PENDING_CONFIRMATION, CONFIRMED, READY_FOR_DELIVERY, ASSIGNED, DELIVERING,
             DELIVERED, DELIVERY_FAILED, RETURNED_TO_WAREHOUSE, CANCELLED]
    OrderSummary:
      type: object
      required: [id, orderCode, status, paymentMethod, totalAmount, itemCount, createdAt]
      properties:
        id: { type: integer, format: int64 }
        orderCode: { type: string, example: OD261015-7KQ2MX }
        status: { $ref: '#/components/schemas/OrderStatus' }
        paymentMethod: { type: string, enum: [SIMULATED_QR, COD] }
        totalAmount: { type: number, description: VND amount }
        itemCount: { type: integer, description: Total quantity across lines }
        createdAt: { type: string, format: date-time }
    OrderPage:
      type: object
      required: [items, page, size, totalItems, totalPages]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/OrderSummary' }
        page: { type: integer }
        size: { type: integer }
        totalItems: { type: integer, format: int64 }
        totalPages: { type: integer, format: int64 }
    OrderItem:
      type: object
      required: [id, productId, sku, name, unitPrice, quantity, discountAmount, lineTotal]
      properties:
        id: { type: integer, format: int64 }
        productId: { type: integer, format: int64 }
        sku: { type: string, description: Snapshot at checkout }
        name: { type: string, description: Snapshot at checkout }
        unitPrice: { type: number, description: VND snapshot at checkout }
        quantity: { type: integer, minimum: 1 }
        discountAmount: { type: number, description: This line's share of the order voucher discount }
        lineTotal: { type: number, description: unitPrice × quantity − discountAmount }
    PaymentAttempt:
      type: object
      required: [id, attemptNumber, method, status, amount, simulated]
      properties:
        id: { type: integer, format: int64 }
        attemptNumber: { type: integer, minimum: 1, maximum: 3 }
        method: { type: string, enum: [SIMULATED_QR, COD] }
        status: { type: string, enum: [PENDING, UNPAID, PAID, FAILED, EXPIRED, CANCELLED] }
        amount: { type: number, description: VND amount }
        simulationCode: { type: string, nullable: true, description: QR only }
        expiresAt: { type: string, format: date-time, nullable: true, description: QR only }
        paidAt: { type: string, format: date-time, nullable: true }
        simulated: { type: boolean, description: True for QR — simulated payment, no real money is transferred }
    OrderDetail:
      type: object
      required: [id, orderCode, status, paymentMethod, recipientName, recipientPhone, shippingAddress,
                 subtotal, discountAmount, shippingFee, totalAmount, createdAt, items]
      properties:
        id: { type: integer, format: int64 }
        orderCode: { type: string }
        status: { $ref: '#/components/schemas/OrderStatus' }
        paymentMethod: { type: string, enum: [SIMULATED_QR, COD] }
        recipientName: { type: string }
        recipientPhone: { type: string }
        shippingAddress: { type: string, description: Address snapshot at checkout }
        subtotal: { type: number }
        discountAmount: { type: number }
        shippingFee: { type: number }
        totalAmount: { type: number, description: subtotal − discountAmount + shippingFee }
        voucherCode: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        confirmedAt: { type: string, format: date-time, nullable: true }
        deliveredAt: { type: string, format: date-time, nullable: true }
        cancelledAt: { type: string, format: date-time, nullable: true }
        items:
          type: array
          items: { $ref: '#/components/schemas/OrderItem' }
        payment:
          allOf: [{ $ref: '#/components/schemas/PaymentAttempt' }]
          nullable: true
          description: Latest payment attempt
        refund:
          allOf: [{ $ref: '#/components/schemas/Refund' }]
          nullable: true
          description: Latest simulated refund, e.g. after cancelling a paid order
        paymentAttemptsUsed: { type: integer }
        maxPaymentAttempts: { type: integer }
        cancellable: { type: boolean, description: True before packing }
        paymentRetryAllowed: { type: boolean, description: True when a new QR attempt can be created now }
    Refund:
      type: object
      required: [amount, status, reason, simulated]
      properties:
        amount: { type: number }
        status: { type: string, enum: [PENDING, COMPLETED, FAILED] }
        reason: { type: string, enum: [CUSTOMER_RETURN, CANCELLED_PAID_ORDER, FAILED_PREPAID_DELIVERY] }
        simulated: { type: boolean, description: Always true — no real money is transferred }
    PreviewLine:
      type: object
      required: [productId, sku, name, unitPrice, quantity, availableQuantity, lineSubtotal]
      properties:
        productId: { type: integer, format: int64 }
        sku: { type: string }
        name: { type: string }
        unitPrice: { type: number }
        quantity: { type: integer }
        availableQuantity: { type: integer }
        lineSubtotal: { type: number }
        problem: { type: string, enum: [PRODUCT_UNAVAILABLE, INSUFFICIENT_STOCK], nullable: true }
    CheckoutPreview:
      type: object
      required: [items, subtotal, discountAmount, shippingFee, totalAmount, canPlaceOrder]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/PreviewLine' }
        subtotal: { type: number }
        discountAmount: { type: number }
        shippingFee: { type: number }
        totalAmount: { type: number }
        voucherCode: { type: string, nullable: true }
        canPlaceOrder: { type: boolean }
    VoucherRequest:
      type: object
      required: [code, discountType, discountValue, minOrderAmount, usageLimit, validFrom, validUntil, status]
      properties:
        code: { type: string, pattern: '^[A-Za-z0-9_-]{3,60}$', description: Stored upper-case }
        discountType: { type: string, enum: [FIXED, PERCENT] }
        discountValue: { type: number, minimum: 0, exclusiveMinimum: true, description: VND, or percent up to 100 }
        maxDiscount: { type: number, nullable: true, description: Cap for PERCENT vouchers }
        minOrderAmount: { type: number, minimum: 0 }
        usageLimit: { type: integer, minimum: 1 }
        validFrom: { type: string, format: date-time }
        validUntil: { type: string, format: date-time, description: Must be after validFrom }
        status: { type: string, enum: [DRAFT, ACTIVE, INACTIVE] }
    Voucher:
      allOf:
        - { $ref: '#/components/schemas/VoucherRequest' }
        - type: object
          required: [id, usedCount, createdAt]
          properties:
            id: { type: integer, format: int64 }
            usedCount: { type: integer, description: RESERVED + CONSUMED usages }
            createdAt: { type: string, format: date-time }
    ShipmentTracking:
      type: object
      required: [id, trackingNumber, status, packedAt, codAmount, attempts]
      properties:
        id: { type: integer, format: int64 }
        trackingNumber: { type: string, example: TRK-OD261102-ABC123 }
        status: { type: string, enum: [READY, ASSIGNED, IN_TRANSIT, DELIVERED, DELIVERY_FAILED, RETURNED_TO_WAREHOUSE] }
        deliveryStaffName: { type: string, nullable: true }
        packedAt: { type: string, format: date-time }
        assignedAt: { type: string, format: date-time, nullable: true }
        codAmount: { type: number, description: Cash to collect; 0 for paid QR orders }
        codCollectedAt: { type: string, format: date-time, nullable: true }
        attempts:
          type: array
          items:
            type: object
            properties:
              attemptNumber: { type: integer }
              status: { type: string, enum: [ASSIGNED, IN_TRANSIT, DELIVERED, FAILED, RETURNED] }
              failureReason: { type: string, nullable: true }
              startedAt: { type: string, format: date-time, nullable: true }
              finishedAt: { type: string, format: date-time, nullable: true }
    StaffOrderSummary:
      type: object
      properties:
        id: { type: integer, format: int64 }
        orderCode: { type: string }
        status: { $ref: '#/components/schemas/OrderStatus' }
        paymentMethod: { type: string, enum: [SIMULATED_QR, COD] }
        paymentStatus: { type: string, nullable: true, description: Latest payment attempt status }
        customerName: { type: string }
        recipientPhone: { type: string }
        totalAmount: { type: number }
        itemCount: { type: integer }
        createdAt: { type: string, format: date-time }
        shipmentStatus: { type: string, nullable: true }
        deliveryStaffName: { type: string, nullable: true }
    StaffOrder:
      type: object
      properties:
        id: { type: integer, format: int64 }
        orderCode: { type: string }
        status: { $ref: '#/components/schemas/OrderStatus' }
        paymentMethod: { type: string, enum: [SIMULATED_QR, COD] }
        paymentStatus: { type: string, nullable: true }
        customerName: { type: string }
        customerEmail: { type: string }
        recipientName: { type: string }
        recipientPhone: { type: string }
        shippingAddress: { type: string }
        subtotal: { type: number }
        discountAmount: { type: number }
        shippingFee: { type: number }
        totalAmount: { type: number }
        voucherCode: { type: string, nullable: true }
        note: { type: string, nullable: true, description: Internal note, staff only }
        createdAt: { type: string, format: date-time }
        confirmedAt: { type: string, format: date-time, nullable: true }
        confirmedBy: { type: string, nullable: true }
        cancelledAt: { type: string, format: date-time, nullable: true }
        items: { type: array, items: { $ref: '#/components/schemas/OrderItem' } }
        shipment: { allOf: [{ $ref: '#/components/schemas/ShipmentTracking' }], nullable: true }
        assignable: { type: boolean }
    VoucherPage:
      type: object
      required: [items, page, size, totalItems, totalPages]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Voucher' }
        page: { type: integer }
        size: { type: integer }
        totalItems: { type: integer, format: int64 }
        totalPages: { type: integer, format: int64 }
    ReturnStatus:
      type: string
      enum: [REQUESTED, UNDER_REVIEW, MORE_INFO_REQUIRED, RETURN_AUTHORIZED, INSPECTED, APPROVED, REJECTED, REFUND_PENDING, REFUNDED, PARTIALLY_REFUNDED, CLOSED]
    CreateReturnRequest:
      type: object
      required: [requestType, reason, items]
      properties:
        requestType: { type: string, enum: [REFUND_ONLY, RETURN_AND_REFUND] }
        reason: { type: string, maxLength: 2000 }
        evidenceUrl: { type: string, maxLength: 500, nullable: true }
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [orderItemId, quantity]
            properties:
              orderItemId: { type: integer, format: int64 }
              quantity: { type: integer, minimum: 1 }
    ReturnItemView:
      type: object
      properties:
        id: { type: integer, format: int64 }
        orderItemId: { type: integer, format: int64 }
        productName: { type: string }
        sku: { type: string }
        requestedQuantity: { type: integer }
        refundAmount: { type: number }
        receivedQuantity: { type: integer, nullable: true }
        restockQuantity: { type: integer, nullable: true }
        inspectionResult: { type: string, enum: [ELIGIBLE, NOT_ELIGIBLE], nullable: true }
        conditionNote: { type: string, nullable: true }
    ReturnRequestView:
      type: object
      properties:
        id: { type: integer, format: int64 }
        orderId: { type: integer, format: int64 }
        orderCode: { type: string }
        customerId: { type: integer, format: int64 }
        customerName: { type: string }
        requestType: { type: string, enum: [REFUND_ONLY, RETURN_AND_REFUND] }
        status: { $ref: '#/components/schemas/ReturnStatus' }
        reason: { type: string }
        evidenceUrl: { type: string, nullable: true }
        decisionNote: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        items: { type: array, items: { $ref: '#/components/schemas/ReturnItemView' } }
    ReturnRequestPage:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ReturnRequestView' } }
        page: { type: integer }
        size: { type: integer }
        totalItems: { type: integer, format: int64 }
        totalPages: { type: integer, format: int64 }
    ReturnDecisionRequest:
      type: object
      required: [approved]
      properties:
        approved: { type: boolean }
        note: { type: string, maxLength: 1000, nullable: true, description: Required when approved is false }
    InspectionRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [returnRequestItemId, receivedQuantity, restockQuantity, conditionNote]
            properties:
              returnRequestItemId: { type: integer, format: int64 }
              receivedQuantity: { type: integer, minimum: 0 }
              restockQuantity: { type: integer, minimum: 0 }
              conditionNote: { type: string, maxLength: 1000 }
    RefundView:
      type: object
      properties:
        id: { type: integer, format: int64 }
        orderId: { type: integer, format: int64 }
        returnRequestId: { type: integer, format: int64, nullable: true }
        orderCode: { type: string }
        reason: { type: string, enum: [CUSTOMER_RETURN, CANCELLED_PAID_ORDER, FAILED_PREPAID_DELIVERY] }
        method: { type: string, enum: [SIMULATED_QR, MANUAL_COD] }
        status: { type: string, enum: [PENDING, PROCESSING, COMPLETED, FAILED] }
        amount: { type: number }
        createdAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time, nullable: true }
    RefundPage:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/RefundView' } }
        page: { type: integer }
        size: { type: integer }
        totalItems: { type: integer, format: int64 }
        totalPages: { type: integer, format: int64 }
    FailedDeliveryOrder:
      type: object
      properties:
        orderId: { type: integer, format: int64 }
        orderCode: { type: string }
        customerName: { type: string }
        amount: { type: number }
        returnedAt: { type: string, format: date-time }
    CreateTicketRequest:
      type: object
      required: [subject, message]
      properties:
        subject: { type: string, maxLength: 200 }
        orderId: { type: integer, format: int64, nullable: true }
        message: { type: string, maxLength: 5000 }
    TicketMessageRequest:
      type: object
      required: [message]
      properties:
        message: { type: string, maxLength: 5000 }
    TicketStatusRequest:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [IN_PROGRESS, RESOLVED, CLOSED] }
    SupportTicket:
      type: object
      properties:
        id: { type: integer, format: int64 }
        customerId: { type: integer, format: int64 }
        customerName: { type: string }
        orderId: { type: integer, format: int64, nullable: true }
        orderCode: { type: string, nullable: true }
        subject: { type: string }
        status: { type: string, enum: [OPEN, IN_PROGRESS, RESOLVED, CLOSED] }
        assignedStaffId: { type: integer, format: int64, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        messages:
          type: array
          items:
            type: object
            properties:
              id: { type: integer, format: int64 }
              senderId: { type: integer, format: int64 }
              senderName: { type: string }
              message: { type: string }
              createdAt: { type: string, format: date-time }
    SupportTicketPage:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/SupportTicket' } }
        page: { type: integer }
        size: { type: integer }
        totalItems: { type: integer, format: int64 }
        totalPages: { type: integer, format: int64 }
    DailyMetric:
      type: object
      properties:
        date: { type: string, format: date }
        orderCount: { type: integer, format: int64 }
        paidOrderCount: { type: integer, format: int64 }
        grossRevenue: { type: number, description: Paid QR payments and collected COD }
        refundedAmount: { type: number, description: COMPLETED refunds by completion time }
        refundCount: { type: integer, format: int64 }
    ReportSummary:
      type: object
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        orderCount: { type: integer, format: int64 }
        paidOrderCount: { type: integer, format: int64 }
        grossRevenue: { type: number }
        refundedAmount: { type: number }
        refundCount: { type: integer, format: int64 }
        daily: { type: array, items: { $ref: '#/components/schemas/DailyMetric' } }
    DashboardView:
      type: object
      properties:
        summary: { $ref: '#/components/schemas/ReportSummary' }
        topProducts:
          type: array
          items:
            type: object
            properties:
              productId: { type: integer, format: int64 }
              sku: { type: string }
              name: { type: string }
              unitsSold: { type: integer, format: int64 }
              revenue: { type: number }
        lowStock:
          type: array
          items:
            type: object
            properties:
              productId: { type: integer, format: int64 }
              sku: { type: string }
              name: { type: string }
              available: { type: integer }
              reorderThreshold: { type: integer }
        pendingActions:
          type: object
          properties:
            returnRequestsToDecide: { type: integer, format: int64 }
            pendingRefunds: { type: integer, format: int64 }
            unassignedOpenTickets: { type: integer, format: int64 }
            deliveryFailedOrders: { type: integer, format: int64 }
            paidQrReturnedWithoutRefund: { type: integer, format: int64 }
    StaffReportRow:
      type: object
      properties:
        staffName: { type: string }
        role: { type: string, enum: [WAREHOUSE, DELIVERY] }
        reportDate: { type: string, format: date }
        content: { type: string }
        updatedAt: { type: string, format: date-time }
