openapi: 3.0.3
info:
  title: Online Shop System API
  version: 0.1.0
  description: Implemented public endpoints in the API foundation. Planned endpoints are listed separately in docs/API_CONTRACT.md.
servers:
  - url: http://localhost:8080/api
paths:
  /health:
    get:
      summary: Backend health check
      responses:
        '200':
          description: Backend is running
  /products:
    get:
      summary: List active products in active categories
      parameters:
        - in: query
          name: page
          schema: { type: integer, minimum: 0, default: 0 }
        - in: query
          name: size
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: Product page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductPage'
        '400':
          description: Invalid pagination parameters
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
components:
  schemas:
    Product:
      type: object
      required: [id, sku, name, price, categoryName, availableQuantity]
      properties:
        id: { type: integer, format: int64 }
        sku: { type: string }
        name: { type: string }
        description: { type: string, nullable: true }
        imageUrl: { type: string, nullable: true }
        price: { type: number, description: VND amount }
        categoryName: { type: string }
        availableQuantity: { type: integer, minimum: 0 }
    ProductPage:
      type: object
      required: [items, page, size, totalItems, totalPages]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Product' }
        page: { type: integer }
        size: { type: integer }
        totalItems: { type: integer, format: int64 }
        totalPages: { type: integer, format: int64 }
    Problem:
      type: object
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code: { type: string }
