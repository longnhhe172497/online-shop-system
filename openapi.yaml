            schema: { $ref: '#/components/schemas/CategoryStatusRequest' }
      responses:
        '200':
          description: Category with the new status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ManagerCategory' }
        '400': { description: Unknown status }
        '404': { description: CATEGORY_NOT_FOUND }
        '409': { description: CATEGORY_HAS_PRODUCTS }
  /products/{id}/reviews:
    get:
      summary: Public VISIBLE reviews of a product, newest first
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer, format: int64 } }
        - { in: query, name: page, schema: { type: integer, minimum: 0, default: 0 } }
        - { in: query, name: size, schema: { type: integer, minimum: 1, maximum: 50, default: 10 } }
      responses:
        '200':
          description: Review page. Author names are shortened (e.g. "Phạm Đ.").
