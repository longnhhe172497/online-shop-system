openapi: 3.0.3
info:
  title: Online Shop System API
  version: 0.2.0
  description: Implemented API foundation and authentication endpoints. Planned endpoints are listed separately in docs/API_CONTRACT.md.
servers:
  - url: http://localhost:8080/api
paths:
  /health:
    get:
      summary: Backend health check
      responses:
        '200':
          description: Backend is running
  /auth/register:
    post:
      summary: Register a Customer account and send a verification email using the configured mail transport
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: Account created, awaiting email verification
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegisterResponse' }
        '400': { description: Validation failed }
        '409': { description: Email already registered }
  /auth/verify:
    post:
      summary: Consume a single-use email verification token
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VerifyRequest' }
      responses:
        '200':
          description: Email verified
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VerifyResponse' }
        '400': { description: Invalid, expired, or used token }
  /auth/login:
    post:
      summary: Exchange credentials for a 24-hour opaque bearer token
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '401': { description: Wrong credentials or inactive account }
  /auth/password-reset/request:
    post:
      summary: Send a single-use password reset link for an active account
      description: Always returns 202 for valid email input, including unknown accounts. Links expire after 30 minutes; requests are limited to one email per account per five minutes.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordResetRequest' }
      responses:
        '202': { description: Request accepted regardless of account existence }
        '400': { description: Invalid email }
  /auth/password-reset/confirm:
    post:
      summary: Consume a password reset link and revoke existing sessions
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordResetConfirmRequest' }
      responses:
        '200':
          description: Password changed and previous sessions revoked
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PasswordResetConfirmResponse' }
        '400': { description: Invalid or used token, or passwords do not match }
  /auth/logout:
    post:
      summary: Revoke the current bearer token
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Signed out }
        '401': { description: Missing or invalid token }
  /me:
    get:
      summary: Return the authenticated user's public profile
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Profile' }
        '401': { description: Missing, expired, or revoked token }
    patch:
      summary: Update own full name and phone (email and role are read-only)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProfileUpdateRequest' }
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Profile' }
        '400': { description: Validation failed }
        '401': { description: Missing or invalid token }
  /me/addresses:
    get:
      summary: List current Customer's saved addresses, default first
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Own addresses
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Address' }
        '403': { description: Authenticated role is not Customer }
    post:
      summary: Save an address for the current Customer (maximum from system settings)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddressRequest' }
      responses:
        '201':
          description: Saved address
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Address' }
        '403': { description: Authenticated role is not Customer }
        '409': { description: Saved address limit reached }
  /me/addresses/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer, format: int64 }
    patch:
      summary: Update an address owned by the current Customer
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddressRequest' }
      responses:
        '200':
          description: Updated address
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Address' }
        '403': { description: Authenticated role is not Customer }
        '404': { description: Address is not owned by current Customer }
    delete:
      summary: Delete an owned address; another saved address becomes default if necessary
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Address deleted }
        '403': { description: Authenticated role is not Customer }
        '404': { description: Address is not owned by current Customer }
  /products:
    get:
      summary: Search active products in active categories
      parameters:
        - { in: query, name: page, schema: { type: integer, minimum: 0, default: 0 } }
        - { in: query, name: size, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { in: query, name: q, description: Matches name, description or category name (wildcards are literal), schema: { type: string, maxLength: 100 } }
        - { in: query, name: categoryId, schema: { type: integer, format: int64, minimum: 1 } }
        - { in: query, name: minPrice, schema: { type: number, minimum: 0 } }
        - { in: query, name: maxPrice, schema: { type: number, minimum: 0 } }
        - { in: query, name: sort, schema: { type: string, enum: [newest, price_asc, price_desc, name], default: newest } }
      responses:
        '200':
          description: Product page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductPage' }
        '400':
          description: Invalid parameters, or minPrice greater than maxPrice
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /products/{id}:
    get:
      summary: Product detail with rating from visible reviews
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer, format: int64, minimum: 1 } }
      responses:
        '200':
          description: Product detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductDetail' }
        '404': { description: Product missing, not ACTIVE, or its category is not ACTIVE }
  /categories:
    get:
      summary: List active categories (flat list)
      responses:
        '200':
          description: Categories ordered by name
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Category' }
  /cart:
    get:
      summary: Current cart of the signed-in Customer or the guest FORME_CART cookie
      responses:
        '200':
          description: Cart; empty when there is no cart yet
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
        '403': { description: Staff accounts cannot use the cart }
  /cart/items:
    post:
      summary: Add a product; quantities for the same product are added together
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [productId, quantity]
              properties:
                productId: { type: integer, format: int64, minimum: 1 }
                quantity: { type: integer, minimum: 1, maximum: 99 }
      responses:
        '200':
          description: Updated cart. The first guest add also sets an HttpOnly FORME_CART cookie.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
        '400': { description: Invalid product ID or quantity }
        '403': { description: Staff account, or CSRF token missing for a request with a cart or session cookie }
        '404': { description: Product not found }
        '409': { description: PRODUCT_UNAVAILABLE, INSUFFICIENT_STOCK or QUANTITY_LIMIT }
        '429': { description: Too many new guest carts from this address }
  /cart/items/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer, format: int64 } }
    patch:
      summary: Change a line's quantity (raising it is stock-checked)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quantity]
              properties:
                quantity: { type: integer, minimum: 1, maximum: 99 }
      responses:
        '200':
          description: Updated cart
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
        '404': { description: Line not in the caller's cart }
        '409': { description: PRODUCT_UNAVAILABLE or INSUFFICIENT_STOCK }
    delete:
      summary: Remove a line from the caller's cart
      responses:
        '200':
          description: Updated cart
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
        '404': { description: Line not in the caller's cart }
  /admin/users:
    get:
      summary: Search managed accounts (Admin only)
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: search, schema: { type: string } }
        - { in: query, name: role, schema: { type: string } }
        - { in: query, name: status, schema: { type: string } }
        - { in: query, name: page, schema: { type: integer, default: 0 } }
        - { in: query, name: size, schema: { type: integer, default: 20, maximum: 100 } }
      responses:
        '200': { description: Paginated accounts without password hashes }
        '403': { description: Admin role required }
  /admin/role-permissions:
    get:
      summary: List editable staff roles, permission catalog and current grants (Admin only)
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      responses:
        '200':
          description: Permission matrix; Admin and Customer are deliberately not editable
          content:
            application/json:
              schema:
                type: object
                properties:
                  catalog:
                    type: array
                    items:
                      type: object
                      properties:
                        code: { type: string }
                        label: { type: string }
                        group: { type: string }
                        endpoint: { type: string }
                  roles:
                    type: array
                    items:
                      type: object
                      properties:
                        role: { type: string, enum: [MANAGER, SUPPORT, WAREHOUSE, DELIVERY] }
                        version: { type: integer }
                        permissions: { type: array, items: { type: string } }
        '403': { description: Admin role required }
  /admin/role-permissions/{role}:
    parameters:
      - { in: path, name: role, required: true, schema: { type: string, enum: [MANAGER, SUPPORT, WAREHOUSE, DELIVERY] } }
    put:
      summary: Replace a staff role's grants with optimistic version check; audited and effective on next request
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version, permissions]
              properties:
                version: { type: integer, minimum: 0 }
                permissions: { type: array, uniqueItems: true, items: { type: string } }
      responses:
        '200': { description: Updated role, version and grants }
        '400': { description: Uneditable role or unknown/duplicate permission }
        '403': { description: Admin role required }
        '409': { description: Another Admin changed the role; reload before retrying }
  /admin/users/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer, format: int64 } }
    get:
      summary: Read account details, active sessions and recent activity (Admin only)
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      responses:
        '200': { description: Account detail without credentials or session tokens }
        '404': { description: Account not found }
    patch:
      summary: Update account name and phone (Admin only)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fullName]
              properties:
                fullName: { type: string, maxLength: 150 }
                phone: { type: string, maxLength: 30 }
      responses:
        '200': { description: Updated account }
  /admin/users/{id}/sessions/revoke:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer, format: int64 } }
    post:
      summary: Revoke all active sessions for a managed account (Admin only)
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      responses:
        '200': { description: Sessions revoked and action audited }
  /admin/users/{id}/role:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer, format: int64 } }
    patch:
      summary: Change account role; final active Admin is protected
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { type: string, enum: [CUSTOMER, ADMIN, MANAGER, SUPPORT, WAREHOUSE, DELIVERY] }
      responses:
        '200': { description: Updated account }
        '409': { description: Cannot remove final active Admin }
  /admin/users/{id}/status:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer, format: int64 } }
    patch:
      summary: Activate, deactivate, or lock account; final active Admin is protected
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [ACTIVE, INACTIVE, LOCKED] }
      responses:
        '200': { description: Updated account }
        '409': { description: Email not verified or final active Admin protected }
  /admin/settings:
    get:
      summary: List system settings (Admin only)
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: System settings }
  /admin/settings/{key}:
    parameters:
      - { in: path, name: key, required: true, schema: { type: string } }
    patch:
      summary: Update a validated system setting (Admin only)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [value]
              properties:
                value: { type: string }
      responses:
        '200': { description: Updated setting }
        '400': { description: Setting outside allowed range }
  /admin/audit-logs:
    get:
      summary: Read append-only audit trail (Admin only)
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: page, schema: { type: integer, default: 0 } }
        - { in: query, name: size, schema: { type: integer, default: 20, maximum: 100 } }
        - { in: query, name: actor, schema: { type: string }, description: Partial actor email }
        - { in: query, name: action, schema: { type: string }, description: Exact action code }
        - { in: query, name: from, schema: { type: string, format: date } }
        - { in: query, name: to, schema: { type: string, format: date } }
      responses:
        '200': { description: Paginated audit entries }
        '400': { description: Invalid date range }
  /auth/csrf:
    get:
      summary: Set the readable XSRF-TOKEN cookie before browser write requests
      responses:
        '200': { description: CSRF token initialized }
  /auth/browser-login:
    post:
      summary: Sign in a browser with an HttpOnly FORME_SESSION cookie
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200': { description: Session cookie or email MFA challenge }
        '401': { description: Invalid credentials or inactive account }
        '429': { description: Too many attempts }
  /auth/google/config:
    get:
      summary: Read optional Google Identity Services Web client ID
      responses:
        '200':
          description: Public client ID and enabled flag; never contains a client secret
          content:
            application/json:
              schema:
                type: object
                required: [enabled, clientId]
                properties:
                  enabled: { type: boolean }
                  clientId: { type: string }
  /auth/browser-google-login:
    post:
      summary: Verify a Google ID token and sign in with the existing browser cookie/MFA flow
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [credential]
              properties:
                credential: { type: string, description: Signed Google ID token }
      responses:
        '200': { description: Session cookie and user or MFA challenge }
        '401': { description: Invalid Google ID token }
        '409': { description: Existing email must be linked from the authenticated account }
        '503': { description: Google sign-in is not configured }
  /auth/mfa/verify:
    post:
      summary: Complete MFA with an email, TOTP or single-use recovery code and obtain a bearer token
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MfaVerifyRequest' }
      responses:
        '200': { description: Bearer session issued }
        '400': { description: Wrong, expired or used code }
  /auth/browser-mfa/verify:
    post:
      summary: Complete MFA with an email, TOTP or single-use recovery code and obtain a browser cookie
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MfaVerifyRequest' }
      responses:
        '200': { description: Browser session issued }
        '400': { description: Wrong, expired or used code }
  /auth/verification/resend:
    post:
      summary: Resend verification mail without disclosing account existence
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordResetRequest' }
      responses:
        '202': { description: Accepted }
        '429': { description: Rate limit reached }
  /auth/email-change/confirm:
    post:
      summary: Confirm a new login email and revoke all sessions
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TokenRequest' }
      responses:
        '204': { description: Email changed }
        '400': { description: Invalid, expired or used token }
  /me/limits:
    get:
      summary: Read the current saved-address limit
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      responses:
        '200': { description: '{maxSavedAddresses} from system settings' }
  /me/security:
    get:
      summary: Read MFA method, enrollment status and unused recovery-code count
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      responses:
        '200': { description: '{mfaEnabled,mfaMethod,recoveryCodesRemaining}; never returns stored recovery codes' }
  /me/google:
    get:
      summary: Check whether this account has a linked Google identity
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      responses:
        '200': { description: '{linked}' }
  /me/google/link:
    post:
      summary: Link a matching verified Google identity after checking the current password
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password, credential]
              properties:
                password: { type: string, format: password }
                credential: { type: string, description: Signed Google ID token }
      responses:
        '204': { description: Linked }
        '401': { description: Password or session invalid }
        '409': { description: Email mismatch or Google identity already linked }
  /me/password:
    post:
      summary: Change password and revoke all sessions
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangePasswordRequest' }
      responses:
        '204': { description: Password changed }
        '400': { description: Current password is wrong or confirmation mismatches }
  /me/sessions:
    get:
      summary: List the current user's active login sessions
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      responses:
        '200': { description: Active sessions, including lastSeenAt, device metadata and current flag }
  /me/sessions/{id}:
    delete:
      summary: Revoke an owned session
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer, format: int64 } }
      responses:
        '204': { description: Session revoked }
  /me/sessions/revoke-other:
    post:
      summary: Revoke all other sessions while keeping this one
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      responses:
        '204': { description: Other sessions revoked }
  /me/mfa/start:
    post:
      summary: Email a six-digit enrollment code
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      responses:
        '200': { description: '{challengeToken}; code expires in 10 minutes' }
  /me/mfa/confirm:
    post:
      summary: Confirm enrollment and enable email MFA; show eight recovery codes once
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MfaVerifyRequest' }
      responses:
        '200': { description: '{recoveryCodes}; codes are shown once and stored only as hashes' }
  /me/mfa/totp/start:
    post:
      summary: Begin authenticator-app enrollment after checking the current password
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CurrentPasswordRequest' }
      responses:
        '200': { description: '{secret,otpauthUri}; display once during enrollment' }
        '409': { description: Another MFA method is already enabled }
  /me/mfa/totp/confirm:
    post:
      summary: Confirm a fresh TOTP code and show recovery codes once
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TotpConfirmRequest' }
      responses:
        '200': { description: '{recoveryCodes}; TOTP enabled' }
        '400': { description: Code invalid or enrollment expired }
  /me/mfa/step-up/start:
    post:
      summary: Require current password and start factor verification for a sensitive MFA change
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CurrentPasswordRequest' }
      responses:
        '200': { description: '{challengeToken,mfaMethod}; email code sent for EMAIL method' }
  /me/mfa/recovery/regenerate:
    post:
      summary: Replace all unused MFA recovery codes after checking password and existing factor
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MfaSensitiveRequest' }
      responses:
        '200': { description: '{recoveryCodes}; previous recovery codes are invalidated' }
        '400': { description: Current password is wrong }
        '409': { description: MFA is not enabled }
  /me/mfa/disable:
    post:
      summary: Disable MFA after checking password and existing factor
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MfaSensitiveRequest' }
      responses:
        '204': { description: MFA disabled }
  /me/email-change:
    post:
      summary: Send a confirmation link to the proposed new email
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmailChangeRequest' }
      responses:
        '202': { description: Confirmation email sent }
        '409': { description: Email already registered }
  /admin/invitations:
    get:
      summary: List the 100 most recent staff invitations (Admin only)
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      responses:
        '200': { description: Invitation list with PENDING, STALLED, SENT, FAILED, REVOKED, EXPIRED or ACCEPTED status }
    post:
      summary: Send a 48-hour staff invitation (Admin only)
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StaffInvitationRequest' }
      responses:
        '201': { description: Invitation sent }
        '409': { description: Email already registered }
        '503': { description: SMTP delivery failed; invitation marked FAILED and cannot be accepted }
  /admin/invitations/{id}/resend:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer, format: int64 } }
    post:
      summary: Issue a new link for a failed, expired or stalled invitation (Admin only)
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      responses:
        '201': { description: New invitation sent; old link invalidated }
        '409': { description: Invitation cannot be resent }
  /admin/invitations/{id}/revoke:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer, format: int64 } }
    post:
      summary: Revoke an unaccepted invitation (Admin only)
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      responses:
        '200': { description: Invitation revoked and action audited }
        '409': { description: Invitation is no longer revocable }
  /invitations/accept:
    post:
      summary: Accept a staff invitation and set a personal password
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AcceptInvitationRequest' }
      responses:
        '201': { description: Account activated }
        '400': { description: Invalid or expired invitation }
  /orders:
    post:
      summary: Place an order from the current Customer's ACTIVE cart
      description: >-
        Locks the cart and product rows, re-checks product availability and stock, applies an optional
        voucher, reserves stock and the voucher, and marks the cart CONVERTED. On-hand stock is reduced
        only when the warehouse packs the order. SIMULATED_QR orders start AWAITING_PAYMENT with a PENDING
        simulated attempt (no real money is transferred); COD orders start PENDING_CONFIRMATION.
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlaceOrderRequest' }
            example: { addressId: 12, paymentMethod: SIMULATED_QR, voucherCode: SHOP50 }
      responses:
        '201':
          description: Order placed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderDetail' }
        '400': { description: Invalid request body }
        '403': { description: Authenticated role is not Customer }
        '404':
          description: ADDRESS_NOT_FOUND — the address does not belong to the current Customer
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: PRODUCT_UNAVAILABLE, INSUFFICIENT_STOCK or VOUCHER_USAGE_LIMIT_REACHED
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: CART_EMPTY, VOUCHER_INVALID, VOUCHER_NOT_ACTIVE or VOUCHER_MIN_ORDER_NOT_MET
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
    get:
      summary: List the current Customer's orders, newest first
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      parameters:
        - in: query
          name: page
          schema: { type: integer, minimum: 0, default: 0 }
        - in: query
          name: size
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: Own order page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderPage' }
        '400': { description: Invalid pagination parameters }
        '403': { description: Authenticated role is not Customer }
  /orders/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer, format: int64 } }
    get:
      summary: Get an order owned by the current Customer
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      responses:
        '200':
          description: Order detail with item snapshots and the latest payment attempt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderDetail' }
        '403': { description: Authenticated role is not Customer }
        '404': { description: ORDER_NOT_FOUND — absent or owned by another Customer }
  /orders/preview:
    post:
      summary: Quote the current Customer's ACTIVE cart without reserving anything
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                voucherCode: { type: string, maxLength: 60, nullable: true }
      responses:
        '200':
          description: Quote; an empty cart returns no lines and canPlaceOrder=false
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CheckoutPreview' }
        '403': { description: Authenticated role is not Customer }
        '409': { description: VOUCHER_USAGE_LIMIT_REACHED }
        '422': { description: VOUCHER_INVALID, VOUCHER_NOT_ACTIVE or VOUCHER_MIN_ORDER_NOT_MET }
  /orders/{id}/cancel:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer, format: int64 } }
    post:
      summary: Cancel an own order before packing
      description: >-
        Allowed in AWAITING_PAYMENT, PENDING_CONFIRMATION and CONFIRMED. Releases reserved stock and the voucher
        and cancels unfinished payment attempts. A paid order gets a PENDING simulated refund (CANCELLED_PAID_ORDER).
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, maxLength: 300, nullable: true }
      responses:
        '200':
          description: Cancelled order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderDetail' }
        '404': { description: ORDER_NOT_FOUND }
        '409': { description: ORDER_NOT_CANCELLABLE }
  /orders/{id}/payment-attempts:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer, format: int64 } }
    post:
      summary: Create a new simulated QR attempt after a failed or expired one
      description: >-
        Re-checks product status, unchanged price, available stock and the voucher, then reserves again.
        At most max_qr_attempts attempts per order. No real money is transferred.
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      responses:
        '201':
          description: Order with the new PENDING attempt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderDetail' }
        '404': { description: ORDER_NOT_FOUND }
        '409':
          description: >-
            PAYMENT_RETRY_NOT_ALLOWED, PAYMENT_ATTEMPT_ALREADY_PENDING, PAYMENT_ATTEMPTS_EXHAUSTED,
            PRICE_CHANGED, PRODUCT_UNAVAILABLE, INSUFFICIENT_STOCK or VOUCHER_USAGE_LIMIT_REACHED
        '422': { description: VOUCHER_NOT_ACTIVE or VOUCHER_MIN_ORDER_NOT_MET }
  /payment-attempts/{id}/simulate:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer, format: int64 } }
    post:
      summary: Simulate the result of an own PENDING QR attempt (development only, no real money)
      description: >-
        SUCCESS marks the attempt PAID, the order CONFIRMED and the voucher CONSUMED. FAILURE marks the attempt
        FAILED and releases its stock and voucher; after the last allowed attempt the order is CANCELLED.
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [outcome]
              properties:
                outcome: { type: string, enum: [SUCCESS, FAILURE] }
      responses:
        '200':
          description: Updated order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderDetail' }
        '404': { description: PAYMENT_ATTEMPT_NOT_FOUND }
        '409': { description: PAYMENT_ATTEMPT_NOT_PENDING or PAYMENT_ATTEMPT_EXPIRED }
  /orders/{id}/shipment:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer, format: int64 } }
    get:
      summary: Track the shipment of an own order (UC-CUS-018)
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      responses:
        '200':
          description: Shipment with delivery attempts
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShipmentTracking' }
        '403': { description: Authenticated role is not Customer }
        '404': { description: ORDER_NOT_FOUND (absent or another customer's) or SHIPMENT_NOT_FOUND (not packed yet) }
  /support/orders/pending:
    get:
      summary: COD orders waiting for Support confirmation, oldest first (SUPPORT_ORDER_VIEW)
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      parameters:
        - { in: query, name: page, schema: { type: integer, minimum: 0, default: 0 } }
        - { in: query, name: size, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: Page of pending COD orders
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/StaffOrder' } }
                  page: { type: integer }
                  size: { type: integer }
                  totalItems: { type: integer, format: int64 }
                  totalPages: { type: integer, format: int64 }
        '403': { description: Missing SUPPORT_ORDER_VIEW }
  /support/orders/{id}/confirm:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer, format: int64 } }
    post:
      summary: Confirm a COD order so the warehouse can pack it (SUPPORT_ORDER_CONFIRM)
      description: Stock stays reserved and payment stays UNPAID until the shipper collects the cash. The customer is emailed.
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema: { type: object, properties: { note: { type: string, maxLength: 500, nullable: true } } }
      responses:
        '200':
          description: Order CONFIRMED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffOrder' }
        '403': { description: Missing SUPPORT_ORDER_CONFIRM }
        '404': { description: ORDER_NOT_FOUND }
        '409': { description: ORDER_NOT_PENDING_CONFIRMATION }
  /support/orders/{id}/cancel:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer, format: int64 } }
    post:
      summary: Cancel a COD order that cannot be confirmed (SUPPORT_ORDER_CONFIRM)
      description: Releases reserved stock and the voucher; the reason is stored in the order note.
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties: { reason: { type: string, minLength: 1, maxLength: 300 } }
      responses:
        '200':
          description: Order CANCELLED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffOrder' }
        '400': { description: Missing reason }
        '403': { description: Missing SUPPORT_ORDER_CONFIRM }
        '404': { description: ORDER_NOT_FOUND }
        '409': { description: ORDER_NOT_PENDING_CONFIRMATION }
  /manager/orders:
    get:
      summary: All orders, newest first (MANAGER_ORDER_VIEW)
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [AWAITING_PAYMENT, PENDING_CONFIRMATION, CONFIRMED, READY_FOR_DELIVERY, ASSIGNED, DELIVERING,
                   DELIVERED, DELIVERY_FAILED, RETURNED_TO_WAREHOUSE, CANCELLED]
        - { in: query, name: search, schema: { type: string }, description: Order code, customer name or email, or recipient phone }
        - { in: query, name: page, schema: { type: integer, minimum: 0, default: 0 } }
        - { in: query, name: size, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: Order page
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/StaffOrderSummary' } }
                  page: { type: integer }
                  size: { type: integer }
                  totalItems: { type: integer, format: int64 }
                  totalPages: { type: integer, format: int64 }
        '400': { description: INVALID_STATUS or invalid paging }
        '403': { description: Missing MANAGER_ORDER_VIEW }
  /manager/orders/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer, format: int64 } }
    get:
      summary: Order detail with items, payment and shipment (MANAGER_ORDER_VIEW)
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      responses:
        '200':
          description: Order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffOrder' }
        '403': { description: Missing MANAGER_ORDER_VIEW }
        '404': { description: ORDER_NOT_FOUND }
  /manager/delivery-staff:
    get:
      summary: Active Delivery Staff with their unfinished shipment count (MANAGER_ORDER_ASSIGN)
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      responses:
        '200':
          description: Delivery Staff
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, fullName, email, activeShipments]
                  properties:
                    id: { type: integer, format: int64 }
                    fullName: { type: string }
                    email: { type: string }
                    activeShipments: { type: integer }
        '403': { description: Missing MANAGER_ORDER_ASSIGN }
  /manager/orders/{id}/assign:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer, format: int64 } }
    post:
      summary: Assign or reassign a packed order to a Delivery Staff member (MANAGER_ORDER_ASSIGN)
      description: >-
        READY_FOR_DELIVERY or ASSIGNED orders become ASSIGNED (reassignment allowed until the parcel leaves).
        DELIVERY_FAILED orders keep their status and get a new shipper while delivery attempts remain.
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deliveryStaffId]
              properties: { deliveryStaffId: { type: integer, format: int64 } }
      responses:
        '200':
          description: Order with the assigned shipment
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffOrder' }
        '403': { description: Missing MANAGER_ORDER_ASSIGN }
        '404': { description: ORDER_NOT_FOUND }
        '409': { description: ORDER_NOT_ASSIGNABLE or MAX_ATTEMPTS_REACHED }
        '422': { description: INVALID_DELIVERY_STAFF }
  /manager/vouchers:
    get:
      summary: List vouchers (requires MANAGER_VOUCHER_MANAGE)
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      parameters:
        - { in: query, name: search, schema: { type: string } }
        - { in: query, name: page, schema: { type: integer, minimum: 0, default: 0 } }
        - { in: query, name: size, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: Voucher page, newest first
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VoucherPage' }
        '403': { description: Missing MANAGER_VOUCHER_MANAGE }
    post:
      summary: Create a store-wide voucher (requires MANAGER_VOUCHER_MANAGE)
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VoucherRequest' }
      responses:
        '201':
          description: Created voucher
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Voucher' }
        '400': { description: Invalid request body }
        '403': { description: Missing MANAGER_VOUCHER_MANAGE }
        '409': { description: VOUCHER_CODE_EXISTS }
        '422': { description: VOUCHER_RULE_INVALID }
  /manager/vouchers/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer, format: int64 } }
    patch:
      summary: Replace a voucher's fields (requires MANAGER_VOUCHER_MANAGE)
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VoucherRequest' }
      responses:
        '200':
          description: Updated voucher
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Voucher' }
        '404': { description: VOUCHER_NOT_FOUND }
        '409': { description: VOUCHER_CODE_EXISTS or VOUCHER_LIMIT_BELOW_USAGE }
        '422': { description: VOUCHER_RULE_INVALID }
    delete:
      summary: Delete a voucher that was never used (requires MANAGER_VOUCHER_MANAGE)
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      responses:
        '204': { description: Deleted }
        '404': { description: VOUCHER_NOT_FOUND }
        '409': { description: VOUCHER_IN_USE — set it INACTIVE instead }
  /manager/products:
    get:
      summary: List products in every status (requires MANAGER_PRODUCT_MANAGE)
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      parameters:
        - { in: query, name: q, description: 'Matches name or SKU (wildcards are literal)', schema: { type: string, maxLength: 100 } }
        - { in: query, name: categoryId, schema: { type: integer, format: int64, minimum: 1 } }
        - { in: query, name: status, schema: { type: string, enum: [DRAFT, ACTIVE, INACTIVE, ARCHIVED] } }
        - { in: query, name: page, schema: { type: integer, minimum: 0, default: 0 } }
        - { in: query, name: size, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: Product page, newest first
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ManagerProductPage' }
        '400': { description: Invalid filter }
        '403': { description: Missing MANAGER_PRODUCT_MANAGE }
    post:
      summary: Create a product as DRAFT with zero stock (requires MANAGER_PRODUCT_MANAGE)
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ManagerProductRequest' }
      responses:
        '201':
          description: Created product
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ManagerProduct' }
        '400': { description: Invalid request body }
        '403': { description: Missing MANAGER_PRODUCT_MANAGE }
        '409': { description: SKU_ALREADY_EXISTS }
        '422': { description: 'CATEGORY_INVALID (missing or archived category)' }
  /manager/products/category-options:
    get:
      summary: Non-archived categories for the product form (requires MANAGER_PRODUCT_MANAGE)
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      responses:
        '200':
          description: Categories ordered by name
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CategoryOption' }
        '403': { description: Missing MANAGER_PRODUCT_MANAGE }
  /manager/products/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer, format: int64 } }
    get:
      summary: Read one product in any status (requires MANAGER_PRODUCT_MANAGE)
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      responses:
        '200':
          description: Product
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ManagerProduct' }
        '404': { description: PRODUCT_NOT_FOUND }
    patch:
      summary: Replace a product's details; stock is never changed here (requires MANAGER_PRODUCT_MANAGE)
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ManagerProductRequest' }
      responses:
        '200':
          description: Updated product
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ManagerProduct' }
        '400': { description: Invalid request body }
        '404': { description: PRODUCT_NOT_FOUND }
        '409': { description: 'SKU_ALREADY_EXISTS, or CATEGORY_NOT_ACTIVE when moving an ACTIVE product' }
        '422': { description: CATEGORY_INVALID }
  /manager/products/{id}/status:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer, format: int64 } }
    patch:
      summary: Publish, hide or archive a product; products are never hard-deleted (requires MANAGER_PRODUCT_MANAGE)
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductStatusRequest' }
      responses:
        '200':
          description: Product with the new status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ManagerProduct' }
        '400': { description: Unknown status }
        '404': { description: PRODUCT_NOT_FOUND }
        '409': { description: 'CATEGORY_NOT_ACTIVE (ACTIVE needs an ACTIVE category)' }
  /manager/categories:
    get:
      summary: List categories with product counts (requires MANAGER_CATEGORY_MANAGE)
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      parameters:
        - { in: query, name: status, schema: { type: string, enum: [ACTIVE, INACTIVE, ARCHIVED] } }
      responses:
        '200':
          description: Categories ordered by name
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ManagerCategory' }
        '403': { description: Missing MANAGER_CATEGORY_MANAGE }
    post:
      summary: Create an ACTIVE category (requires MANAGER_CATEGORY_MANAGE)
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CategoryRequest' }
      responses:
        '201':
          description: Created category
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ManagerCategory' }
        '400': { description: Invalid request body }
        '409': { description: 'CATEGORY_NAME_EXISTS (names are unique ignoring case)' }
  /manager/categories/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer, format: int64 } }
    patch:
      summary: Rename a category or change its description (requires MANAGER_CATEGORY_MANAGE)
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CategoryRequest' }
      responses:
        '200':
          description: Updated category
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ManagerCategory' }
        '404': { description: CATEGORY_NOT_FOUND }
        '409': { description: CATEGORY_NAME_EXISTS }
    delete:
      summary: Delete an empty category (requires MANAGER_CATEGORY_MANAGE)
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      responses:
        '204': { description: Deleted }
        '404': { description: CATEGORY_NOT_FOUND }
        '409': { description: 'CATEGORY_HAS_PRODUCTS (reassign or remove its products first)' }
  /manager/categories/{id}/status:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer, format: int64 } }
